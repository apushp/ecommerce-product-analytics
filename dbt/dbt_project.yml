name: thelook
version: "1.0.0"
profile: thelook

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # data pulled 2026-10-28 (see data/raw/thelook/_snapshot.txt). thelook's daily
  # refresh piles new users and orders into the last few days before a pull
  # (~450 signups/day from Oct 22 vs ~35 normally) and seeds events past the pull
  # date, so the cutoff is the last day before that burst
  as_of_date: "2026-10-22"

models:
  thelook:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table
